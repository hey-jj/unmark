name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The efficacy test fails when the oracle is absent in CI. A local run
  # without the package skips it.
  UNMARK_ORACLE_REQUIRED: "1"
  UNMARK_ORACLE_PYTHON: python

jobs:
  test:
    name: test (stable, ${{ matrix.os }})
    # Run on x86_64 and aarch64 hosts to compare the output bytes of the
    # libm-free transforms and the dwtDct decoder across platforms.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The invisible-watermark package is the subprocess oracle for the
      # dwtDct efficacy test. It is never linked. Its torch dependency is not
      # used by the dwtDct path. tools/oracle.py supplies a stub for it.
      - run: python -m pip install --no-deps invisible-watermark && python -m pip install opencv-python-headless PyWavelets numpy Pillow
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --all-features

  msrv:
    name: msrv (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps invisible-watermark && python -m pip install opencv-python-headless PyWavelets numpy Pillow
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --all-features
