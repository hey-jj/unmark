[package]
name = "unmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic degrade-only cleaner that strips confirmable generative marks from images, audio, and repository files you made"
keywords = ["metadata", "watermark", "c2pa", "provenance", "exif"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
repository = "https://github.com/hey-jj/unmark"
include = [
    "src/**",
    "examples/**",
    "policy/**",
    "skills/**",
    "tests/**",
    "fixtures/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
# Image metadata is the default surface. Audio, OCR, and ASR carry heavier
# trees in milestone 2 and stay opt-in.
default = ["image"]
image = ["dep:png", "dep:jpeg-decoder", "dep:image-webp"]
audio = ["dep:claxon", "dep:flacenc"]
ocr = []
asr = []

[dependencies]
sha2 = "0.10"
png = { version = "0.18", optional = true }
jpeg-decoder = { version = "0.3", default-features = false, features = ["platform_independent"], optional = true }
image-webp = { version = "0.2", optional = true }
claxon = { version = "0.4", optional = true }
flacenc = { version = "0.5", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
lexopt = "0.3"

[[bin]]
name = "unmark"
path = "src/bin/unmark.rs"

# The calibration harness and the fixture generator build under
# --all-targets so they cannot rot, and run only with both media features.
[[example]]
name = "calibrate"
required-features = ["image", "audio"]

[[example]]
name = "calibration_fixtures"
required-features = ["image", "audio"]

[profile.release]
lto = true

# The calibration pins recompute resampling, encoding, and spectra over the
# fixture subset; light optimization keeps that suite short in CI.
[profile.test]
opt-level = 1
