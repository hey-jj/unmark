[package]
name = "unmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic degrade-only cleaner that strips confirmable generative marks from images, audio, and repository files you made"
keywords = ["metadata", "watermark", "c2pa", "provenance", "exif"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
repository = "https://github.com/hey-jj/unmark"
include = [
    "src/**",
    "policy/**",
    "skills/**",
    "tests/**",
    "fixtures/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
# Image metadata is the default surface. Audio, OCR, and ASR carry heavier
# trees in milestone 2 and stay opt-in.
default = ["image"]
image = []
audio = []
ocr = []
asr = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
lexopt = "0.3"

[[bin]]
name = "unmark"
path = "src/bin/unmark.rs"

[profile.release]
lto = true
