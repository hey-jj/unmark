# unmark canonical policy package. Single source for the mark classes, the
# transform catalog, the held list, the guardrails, and the sanity floor. The
# crate and the skill snapshot both read this file. Transform and mark ids are
# stable forever and never derived from display names.
#
# The posture: strip every mark unmark can find by default, keep provenance only
# where a well-formed C2PA claim identifies a camera or sensor capture with no
# later generative action, and let every policy flag turn a strip off.

[policy]
version = "0.2.0"
# sha256 over the canonical serialization of the whole package (this file with
# the digest emptied, LF endings, followed by each signature file path-sorted).
# The build embeds the computed value in every result and snapshot.
digest = ""

[semantics]
# scan_state: the state a detector reports per mark class.
#   confirmed_present  found, with a location or a decoded payload
#   confirmed_absent   scanned exhaustively in a supported container, not present
#   unsupported_format the container is not one this build scans for that mark class
#   malformed          the structure was found and would not parse, presence unknown
#   not_attempted      a blind class, or a detector this build does not carry
# Only confirmed_absent licenses the word absent, and only over the enumerated
# supported set. The supported set is a single constant in the code. This list
# mirrors it for the reader and the code is the authority.
supported_containers = ["jpeg", "png", "webp", "riff-wav", "isobmff", "flac", "svg", "html", "text"]
# honesty class of a mark: confirmable, blind, unaddressed. A confirmable mark
# has a structural address or a public decoder, so removal is provable. A blind
# mark is keyed and this offline build cannot see it, so the report names the
# transform applied and cites what is known about survival. An unaddressed mark
# is named so its absence from the action list is not read as its absence.

# ---------------------------------------------------------------------------
# Mark classes
# ---------------------------------------------------------------------------

[[mark_class]]
id = "c2pa"
honesty = "confirmable"
label = "C2PA manifest"
guard = "A Content Credentials manifest. The parse reads the JUMBF box and the claim's content. It does not verify the signature. A manifest is stripped by default. It is kept only under the certified-capture rule or under --keep c2pa."

[[mark_class]]
id = "png_text"
honesty = "confirmable"
label = "PNG text chunk"
guard = "A tEXt, iTXt, or zTXt chunk. Local generation pipelines write the prompt, the model, the seed, and the workflow graph here. This is the most identifying data on the asset and it reads in any viewer."

[[mark_class]]
id = "exif"
honesty = "confirmable"
label = "EXIF metadata"
guard = "EXIF Software, ProcessingSoftware, ImageDescription, UserComment, camera fields, and timestamps. A generative tool writes its name into Software. Camera-style EXIF without a qualifying C2PA claim is uncertain and is stripped by default, with the hint named in the report."

[[mark_class]]
id = "xmp"
honesty = "confirmable"
label = "XMP packet"
guard = "An XMP packet carrying CreatorTool and provenance fields. C2PA also references a manifest from XMP."

[[mark_class]]
id = "iptc"
honesty = "confirmable"
label = "IPTC block"
guard = "An IPTC-IIM block carrying caption, credit, and source fields."

[[mark_class]]
id = "id3"
honesty = "confirmable"
label = "ID3 tag"
guard = "An ID3v1 or ID3v2 tag. TXXX, COMM, PRIV, and GEOB frames carry tool identity and free-form data. ID3v1 sits at the end of the file, so a walker that reads only the front reports a clean strip while the tag is still there."

[[mark_class]]
id = "vorbis"
honesty = "confirmable"
label = "Vorbis comment"
guard = "A Vorbis comment block. It carries the encoder tag and any tool identity. The whole block is stripped by default. Use --keep vorbis to preserve credits and chapters."

[[mark_class]]
id = "ilst"
honesty = "confirmable"
label = "MP4 ilst tag"
guard = "An MP4 ilst metadata atom carrying tool and encoder identity. The atom is removed and the sample offset tables are corrected by the removed byte count."

[[mark_class]]
id = "riff_ancillary"
honesty = "confirmable"
label = "RIFF ancillary chunk"
guard = "A LIST INFO chunk or an embedded id3 chunk in a WAV, WebP, or AVI container. A RIFF C2PA chunk is the manifest class and MC01 removes it. Dropping a RIFF chunk rebuilds every enclosing size field and honors even-boundary padding, or a decoder rejects the file."

[[mark_class]]
id = "invisibles"
honesty = "confirmable"
label = "invisible Unicode"
guard = "Zero-width characters, variation selectors, and unusual spaces in a text file. A variation-selector run can also carry a C2PA text wrapper, so a run is sorted by kind before it is removed and a wrapper is routed to the manifest path."

[[mark_class]]
id = "dwtdct"
honesty = "confirmable"
label = "dwtDct pixel mark"
guard = "The keyless dwtDct mark, embedded by the CompVis Stable Diffusion script as the 136-bit text StableDiffusionV1 and by the Diffusers SDXL pipeline as the fixed 48-bit payload B3EC907BB19E. The decoder reads the U channel after a BGR to YUV conversion, takes one level of Haar wavelet, quantizes the largest non-first value of each 4x4 low-low block with step 36, and majority-votes the repetitions. Presence is a Hamming agreement with a known payload at or above the declared threshold. The resize at the pinned ratio removes it."
citation = "https://github.com/CompVis/stable-diffusion/blob/main/scripts/txt2img.py and https://github.com/huggingface/diffusers/blob/main/src/diffusers/pipelines/stable_diffusion_xl/watermark.py"

[[mark_class]]
id = "synthid_image"
honesty = "blind"
label = "SynthID-Image"
guard = "A keyed statistical mark in the pixel data of every image the Gemini API generates, vendor-stated. This offline build carries no authorized detector, so it cannot report presence or absence. The default run is applied and the mark is reported as surviving."
survives = "applied, survives. The vendor states every Gemini API image carries it. Conventional-transform survival figures exist only for the external SynthID-O variant: worst-category detection 99.99 percent under quality, 99.97 under spatial, and 99.96 under noise transforms at 0.1 percent false positives. Production figures are not stated."
citation = "https://ai.google.dev/gemini-api/docs/image-generation and https://arxiv.org/html/2510.09263"

[[mark_class]]
id = "tree_ring"
honesty = "blind"
label = "Tree-Ring"
guard = "A keyed mark in the low-frequency Fourier structure of the initial noise. This build cannot see it."
survives = "survives the default run. The cited figures show an effect only from rotation and blur, at average detection 0.375 and 0.563 at 0.1 percent false positives, and their tested strengths are not stated, so neither is runnable."
citation = "https://arxiv.org/html/2401.08573"

[[mark_class]]
id = "stable_signature"
honesty = "blind"
label = "Stable Signature"
guard = "A keyed mark decoded from the pixels. This build cannot see it."
survives = "survives the default run. It detects in 84 percent of images after a crop that keeps a tenth of the pixels at a false-positive rate of one in a billion, which is survival, not an effect."
citation = "https://arxiv.org/html/2303.15435"

[[mark_class]]
id = "synthid_audio"
honesty = "blind"
label = "SynthID-Audio"
guard = "A keyed mark in the audio samples. This build cannot see it."
survives = "survives the default run. The vendor states it survives added noise, MP3 compression, and speed changes."
citation = "https://deepmind.google/models/synthid/"

[[mark_class]]
id = "audioseal"
honesty = "blind"
label = "AudioSeal"
guard = "A neural audio mark. This build cannot see it."
survives = "the 1500 Hz highpass is the one cited transform with an effect: detection accuracy 0.61, true and false positive rates 0.82 and 0.60. The mark is reported as applied against with that figure, never as removed."
citation = "https://arxiv.org/html/2401.17264"

[[mark_class]]
id = "visible_overlay"
honesty = "unaddressed"
label = "visible overlay"
guard = "A visible logo or a corner mark. Removing it needs inpainting, which is model-based work. No transform here touches it."

[[mark_class]]
id = "c2pa_soft_binding"
honesty = "unaddressed"
label = "C2PA soft binding"
guard = "A soft binding registered with an external service. The specification adds it so a file whose manifest was separated can still be matched back to its credential. Deleting the manifest does not delete that record."

[[mark_class]]
id = "generative_fingerprint"
honesty = "unaddressed"
label = "generative fingerprint"
guard = "Frequency artifacts and upsampling traces that let a detector flag a generated image with no watermark involved. No transform here touches them."

# ---------------------------------------------------------------------------
# Transform catalog. Every entry here runs by default on the containers it
# applies to. `kind` is metadata, pixel, audio, or text. A degrade transform
# carries the cited effect and strength it runs at. Applied in a fixed
# canonical order regardless of flag order.
# ---------------------------------------------------------------------------

[[transform]]
id = "MC01"
name = "strip-c2pa-manifest"
order = 10
kind = "metadata"
applies = ["jpeg", "png", "webp", "riff-wav", "isobmff", "text", "svg", "html"]
target = "JUMBF in JPEG APP11, PNG caBX, MP4 uuid box, RIFF C2PA chunk, a C2PA text wrapper"
guard = "Remove the C2PA manifest. The certified-capture rule keeps it when the claim identifies a camera or sensor capture with no later generative action, and --strip-capture overrides that keep. A publisher manifest without a capture action is stripped by default."

[[transform]]
id = "MC02"
name = "strip-xmp"
order = 20
kind = "metadata"
applies = ["jpeg", "png", "webp"]
target = "XMP packet and IPTC block with provenance and generator fields"
guard = "Remove the XMP packet and the IPTC block."

[[transform]]
id = "MC03"
name = "strip-exif"
order = 30
kind = "metadata"
applies = ["jpeg", "png", "webp"]
target = "EXIF Software, ProcessingSoftware, ImageDescription, camera fields, timestamps"
guard = "Remove the EXIF IFD. Camera-style EXIF without a qualifying C2PA claim is uncertain and goes with everything else. Use --keep exif to preserve it."

[[transform]]
id = "MC04"
name = "strip-png-text"
order = 40
kind = "metadata"
applies = ["png"]
target = "PNG tEXt, zTXt, iTXt chunks carrying prompts and workflow JSON"
guard = "Remove the PNG text chunks, the highest-value strip in the catalog, at zero fidelity cost."

[[transform]]
id = "MC05"
name = "strip-audio-tags"
order = 50
kind = "metadata"
applies = ["riff-wav", "mp3", "isobmff"]
target = "ID3v1, ID3v2 including PRIV and GEOB, MP4 ilst"
guard = "Remove the audio tags at both the leading and the trailing location, and the MP4 ilst atom with its sample offsets corrected."

[[transform]]
id = "MC09"
name = "strip-riff-ancillary"
order = 60
kind = "metadata"
applies = ["riff-wav", "webp"]
target = "LIST INFO and an embedded id3 chunk in WAV, WebP, and AVI"
guard = "Remove the named RIFF ancillary chunks and rebuild the enclosing sizes and even-boundary padding."

[[transform]]
id = "MC10"
name = "strip-vorbis-comment"
order = 65
kind = "metadata"
applies = ["flac"]
target = "The FLAC Vorbis comment block, encoder tag included"
guard = "Remove the whole Vorbis comment block and rebuild the last-block flag. Use --keep vorbis to preserve credits and chapters."

[[transform]]
id = "MC06"
name = "strip-unlisted-chunks"
order = 70
kind = "metadata"
applies = ["png", "webp", "riff-wav", "flac"]
target = "Any ancillary chunk not required for decoding and valid output"
guard = "Drop every ancillary chunk the keep list does not name. The keep list holds only what decoding and valid output require, so an ICC color-profile chunk and a colorimetry chunk stay and everything else goes."

[[transform]]
id = "MC07"
name = "strip-invisible-unicode"
order = 80
kind = "text"
applies = ["text", "svg", "html"]
target = "Zero-width characters, variation selectors, unusual spaces in text files"
guard = "Sort each variation-selector run by kind before removing it. A run that parses as a C2PA text wrapper is routed to the manifest path. A run that looks like a wrapper and fails to parse reports malformed and is left alone. Everything else is removed as invisible-character hygiene."

[[transform]]
id = "MC08"
name = "strip-generator-headers"
order = 90
kind = "text"
applies = ["text", "svg", "html"]
target = "SVG metadata, HTML X-Generator, PDF Producer and Creator, comment banners"
guard = "Remove generator identity headers from text and document files."

[[transform]]
id = "PX02"
name = "resize"
order = 120
kind = "pixel"
applies = ["png", "jpeg", "webp"]
params = { ratio = 0.95, filter = "lanczos3" }
strength = "both edges to 95 percent, Lanczos3 on the scalar path"
cited_effect = "dwtDct fails to decode after a resize. The sweep over the efficacy fixtures found no fixture decoding at any ratio from 99.5 percent down to 50 percent, the floor of the sweep, and 95 percent is the mildest ratio that changes both dimensions of every image at or above 10 pixels, so the resample can never round back onto the input grid."
citation = "examples/metrics.rs sweep over fixtures/efficacy on 2026-09-03, with the oracle agreement checks in tests/efficacy.rs"
target = "The dwtDct pixel mark"
guard = "Resample both edges by the pinned ratio with a separable Lanczos3 kernel. This is the removal path for the dwtDct mark, and re-inspection proves the payload no longer decodes. Use --no-degrade or --keep PX02 to skip it."

[[transform]]
id = "PX01"
name = "re-encode"
order = 150
kind = "pixel"
applies = ["jpeg"]
params = { jpeg_quality = 92, jpeg_chroma = "4:4:4" }
strength = "quality 92, 4:4:4 chroma, the crate's own baseline encoder"
cited_effect = "none claimed. A JPEG has no lossless write, so this is the same-container path for a JPEG input and the pin is reported in the result."
target = "The container write for a JPEG input"
guard = "Write a JPEG input back as a baseline JPEG at the pinned quality. No removal is claimed for the encode itself. A PNG or WebP input is written losslessly in its own container."

[[transform]]
id = "AU06"
name = "highpass"
order = 250
kind = "audio"
applies = ["riff-wav", "flac"]
params = { cutoff_hz = 1500.0, order = 2 }
strength = "second-order highpass at 1500 Hz"
cited_effect = "AudioSeal detection accuracy falls to 0.61 under a 1500 Hz highpass, true and false positive rates 0.82 and 0.60."
citation = "https://arxiv.org/html/2401.17264"
target = "AudioSeal"
guard = "Apply the highpass on the scalar path and write the samples back as emitted, integer or float32. The report names the cited figure and never says the mark was removed. Use --no-degrade or --keep AU06 to skip it."

# ---------------------------------------------------------------------------
# Held transforms. Each has no flag, does not run, and appears under "cannot
# do" with its reason.
# ---------------------------------------------------------------------------

[[held]]
id = "PX01-lossy"
name = "re-encode as a degrade on lossy input"
reason = "no cited effect on any mark"

[[held]]
id = "PX03"
name = "border-crop"
reason = "no cited figure shows an effect at a stated strength. A crop keeping a tenth of the pixels leaves Stable Signature at 84 percent detection."

[[held]]
id = "PX04"
name = "requantize"
reason = "no cited effect on any mark"

[[held]]
id = "PX05"
name = "add-noise"
reason = "no cited effect on any mark"

[[held]]
id = "PX06"
name = "rotate-or-flip"
reason = "no cited figure shows an effect at a stated strength. Tree-Ring average detection 0.375 under rotation is cited without its tested strength."

[[held]]
id = "PX07"
name = "blur"
reason = "no cited figure shows an effect at a stated strength. Tree-Ring average detection 0.563 under blur is cited without its tested strength."

[[held]]
id = "PX08"
name = "jpeg-quality-degrade"
reason = "no cited figure shows an effect. Tree-Ring AUC 0.999 at quality 25 against 1.000 clean is survival."

[[held]]
id = "AU01"
name = "resample-round-trip"
reason = "no cited effect on any mark"

[[held]]
id = "AU02"
name = "dither-requantize"
reason = "no cited effect on any mark"

[[held]]
id = "AU03"
name = "lossy-transcode-round-trip"
reason = "dropped from this release. No pure Rust MP3 or AAC encoder meets the dependency bar."

[[held]]
id = "AU04"
name = "eq-tilt"
reason = "no cited effect on any mark"

[[held]]
id = "AU05"
name = "speed-change"
reason = "no cited effect on any mark"

# ---------------------------------------------------------------------------
# Keep list for MC06. Only what decoding and valid output require.
# ---------------------------------------------------------------------------

[allowlist]
keep = [
  "icc-profile",
  "color-profile",
  "colorimetry",
  "gamma",
  "chromaticity",
  "codec-header",
  "stream-config",
  "dimensions",
  "orientation",
  "pixel-aspect",
  "alpha",
  "transparency",
]

# ---------------------------------------------------------------------------
# Sanity floor. The one refusal in the run: an output whose signal fidelity
# against the grid-matched reference falls below this is a broken encode, and
# clean exits 50 with nothing written. The values are PROPOSED to the owner
# with the fixture evidence in the release report.
# ---------------------------------------------------------------------------

[sanity]
status = "proposed"
psnr_floor_db = 25.0
ssim_floor = 0.6

# ---------------------------------------------------------------------------
# Guardrails.
# ---------------------------------------------------------------------------

[[guard]]
id = "G2"
name = "certified-capture"
guard = "An asset is certified capture when its active, well-formed C2PA manifest carries a c2pa.created action whose digital source type is digitalCapture, or a signer naming a camera vendor, and no later action naming a generative tool. The default run is a no-op on it and exits 0, and the report quotes the claim and says it is not signature-verified. --strip-capture overrides the keep and is recorded. A captured image with a later generative action is stripped by default."

[[guard]]
id = "G3"
name = "capture-uncertain"
guard = "Camera-style EXIF without a qualifying C2PA claim is uncertain. The asset is stripped by default and the report names the hint and says --keep exif preserves it. A generative tool can write fake EXIF and a real photograph can be model-edited, so EXIF alone certifies nothing."

[[guard]]
id = "G5"
name = "safety-hashes-out-of-scope"
guard = "Perceptual hashes used for abuse-material matching are not generative watermarks. No transform targets them, none is tuned against them, and none would help. This boundary is permanent, and no flag reaches it. A future transform proposed because it degrades such a hash is rejected on that basis alone."

[[guard]]
id = "G6"
name = "no-keyed-mark-scorer"
guard = "This build ships no estimator that scores how likely a keyed mark is present. A blind class is reported as applied and surviving with its citation, never with a number that would read as a detection. The dwtDct detector is different in kind: the mark is keyless and its decoder is public, so presence is a declared agreement rule with a measured false-positive fraction."

[[guard]]
id = "G7"
name = "never-fabricate-provenance"
guard = "Remove marks and never write them. Never synthesize a manifest, forge a claim generator, backdate a timestamp, or write camera EXIF onto an asset. Removing a record is in scope. Manufacturing a false one has no code path."
